title: "David Degras"
description: "Associate Professor of Mathematics at the University of Massachusetts Boston"
lang: "en-US"
timezone: "America/New_York"

# Temporary test deployment. Change these three values after ownership transfer.
url: "https://yiming-s.github.io"
baseurl: "/ddegras.github.io"
repository: "Yiming-S/ddegras.github.io"

author:
  name: "David Degras"
  email: "David.Degras@umb.edu"
  github: "https://github.com/ddegras"
  scholar: "https://scholar.google.com/citations?user=CYLjVg4AAAAJ&hl=en"
  academia: "https://um-boston.academia.edu/DavidDegras"

markdown: kramdown
permalink: pretty
theme: null

include:
  - _pages

exclude:
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

collections:
  publications:
    output: true
    permalink: /publications/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

sass:
  style: compressed
