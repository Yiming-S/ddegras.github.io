---
layout: default
---

{% assign publication_year = page.date | date: "%Y" %}

<article class="publication-page">
  <a class="back-link" href="{{ '/publications/' | relative_url }}">← All publications</a>
  <p class="page-kicker">{{ page.type | default: "Publication" }} / {{ publication_year }}</p>
  <h1>{{ page.title }}</h1>
  <p class="publication-detail-meta">{{ page.venue }}</p>
  {% if page.citation %}<p class="publication-citation">{{ page.citation }}</p>{% endif %}
  <div class="publication-body">
    {{ content }}
  </div>
</article>
