---
layout: default
---

<article class="content-page{% if page.headline %} content-page--feature{% endif %}{% if page.page_style %} content-page--{{ page.page_style }}{% endif %}">
  <header class="page-header{% if page.headline %} page-header--feature{% endif %}">
    <p class="page-kicker">{{ page.eyebrow | default: site.title }}</p>
    <h1>{{ page.headline | default: page.title }}</h1>
    {% if page.deck %}
      <div class="page-deck">{{ page.deck | markdownify }}</div>
    {% endif %}
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</article>
