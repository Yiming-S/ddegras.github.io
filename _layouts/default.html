<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  {% include head.html %}
  <body class="layout-{{ page.layout }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content" class="site-main{% if page.layout == 'home' %} site-main--home{% endif %}">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
